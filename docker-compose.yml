version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: mcppassword
      POSTGRES_DB: mcpserver
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://mcp:mcppassword@db:5432/mcpserver
      SESSION_SECRET: change-me-in-production
    depends_on:
      - db
    volumes:
      - ./workspace:/workspace

volumes:
  pgdata:
