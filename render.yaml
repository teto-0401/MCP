services:
  - type: web
    name: mcp-api-server
    runtime: node
    buildCommand: pnpm install && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
    pullRequestPreviewsEnabled: false

  - type: web
    name: mcp-dashboard
    runtime: static
    buildCommand: BASE_PATH=/ pnpm install && pnpm --filter @workspace/mcp-dashboard run build
    staticPublishPath: artifacts/mcp-dashboard/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: BASE_PATH
        value: /
      - key: VITE_API_BASE_URL
        sync: false
    pullRequestPreviewsEnabled: false
