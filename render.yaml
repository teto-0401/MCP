services:
  - type: web
    name: mcp-dashboard
    runtime: node
    buildCommand: BASE_PATH=/ pnpm install && pnpm --filter @workspace/mcp-dashboard run build && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
    pullRequestPreviewsEnabled: false
